name: funded_scalper_conservative
starting_equity: 50000
broker:
  provider: alpaca
  account_type: cash
  paper: true
limits:
  daily_max_loss_pct: 0.01
  max_drawdown_pct: 0.05
  max_position_pct: 0.08
  max_trades_per_day: 30
  max_concurrent_positions: 1
  max_consecutive_losses: 3
  max_slippage_bps: 6
risk:
  risk_per_trade_pct: 0.001
  stop_atr_mult: 1.3
  take_profit_r_mult: 1.4
  trailing_stop_atr_mult: 1.0
  time_stop_bars: 6
  force_flat_time_et: "15:55"
execution:
  order_type: marketable_limit
  limit_offset_bps: 1.5
  commission_per_share: 0.0035
  slippage_bps: 1.5
  partial_fill_ratio: 0.85
strategy:
  primary_timeframe: 1m
  modules_enabled: [trend_pullback, mean_reversion, breakout]
  spread_bps_max: 4.0
  min_volume: 150000
  atr_min: 0.03
  atr_max: 3.0
universe:
  symbols: [SPY, QQQ, AAPL, MSFT, NVDA]
  rth_only: true
validation:
  train_fraction: 0.65
  walk_forward_windows: 3
  monte_carlo_runs: 500
  sensitivity_slippage_bps: [1.0, 2.0, 4.0]
data_path: data/sample/spy_sample.csv
log_dir: logs
