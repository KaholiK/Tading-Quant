version: "3.9"
services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DRY_RUN=true
      - CORE_API_PORT=8000
    ports:
      - "8000:8000"
  telegram:
    build:
      context: .
      dockerfile: docker/Dockerfile.telegram
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_TELEGRAM_USER_IDS=${ADMIN_TELEGRAM_USER_IDS}
      - CORE_API_URL=http://core:8000
    depends_on:
      - core
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - core
