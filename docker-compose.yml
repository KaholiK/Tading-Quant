version: '3.9'
services:
  core:
    build: .
    command: ["uvicorn", "memesensei.core.api.server:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - DRY_RUN=true
      - CORE_API_PORT=8000
      - KILL_SWITCH=false
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
  telegram:
    build: .
    command: ["python", "-m", "memesensei.telegram.poller"]
    environment:
      - ADMIN_TELEGRAM_USER_IDS=12345
      - TELEGRAM_BOT_TOKEN=replace
      - CORE_API_PORT=8000
    depends_on:
      - core
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - core
